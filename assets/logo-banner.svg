<?xml version="1.0" encoding="UTF-8"?>
<!--
  drawio-engineering-mcp · brand banner
  Built from eng-mcp-suite/docs/brand/logo-template.svg.
  Glyph: g-diagram (customized: adds a tiny resistor zig-zag inside the
  top-left node so the mark reads as "engineering diagram", not "biz
  flowchart"). Accent: violet (#A78BFA).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320"
     role="img" aria-label="drawio-engineering-mcp: engineering diagrams in draw.io: RF block diagrams, PCB stackups, EMC test setups">
  <title>drawio-engineering-mcp: engineering diagrams in draw.io: RF block diagrams, PCB stackups, EMC test setups</title>

  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0B1220"/>
      <stop offset="50%"  stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>

    <filter id="t-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .accent        { color: #A78BFA; }
      .accent-stroke { stroke: #A78BFA; }
      .accent-fill   { fill:   #A78BFA; }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#t-bg)"/>

  <g stroke="#1E293B" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="40"  x2="1280" y2="40"/>
    <line x1="0" y1="80"  x2="1280" y2="80"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
  </g>

  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="240" height="240" rx="44" ry="44"
          fill="#0B1220" stroke="#1E293B" stroke-width="1"/>
    <rect x="12" y="12" width="216" height="216" rx="34" ry="34"
          fill="none" stroke="#1E293B" stroke-width="1" opacity="0.7"/>

    <!-- Inlined g-diagram glyph (customized: tiny resistor zig-zag inside
         top-left node, capacitor-plate hint inside top-right node: signals
         "engineering schematic", not generic flowchart) -->
    <g id="glyph-slot" transform="translate(40, 40)" filter="url(#t-glow)">
      <g fill="none" class="accent-stroke" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
        <!-- three nodes -->
        <rect x="18" y="34"  width="44" height="28" rx="3"/>
        <rect x="98" y="34"  width="44" height="28" rx="3"/>
        <rect x="58" y="98"  width="44" height="28" rx="3"/>

        <!-- ENGINEERING HINT 1: resistor zig-zag inside top-left node -->
        <path d="M 22 48 L 26 44 L 32 52 L 38 44 L 44 52 L 50 44 L 56 52 L 58 48"
              stroke-opacity="0.85" stroke-width="1.6"/>

        <!-- ENGINEERING HINT 2: capacitor plates inside top-right node -->
        <g stroke-opacity="0.85" stroke-width="1.6">
          <line x1="103" y1="42" x2="103" y2="54"/>
          <line x1="115" y1="38" x2="115" y2="58"/>
          <line x1="119" y1="38" x2="119" y2="58"/>
          <line x1="137" y1="42" x2="137" y2="54"/>
          <line x1="103" y1="48" x2="115" y2="48"/>
          <line x1="119" y1="48" x2="137" y2="48"/>
        </g>

        <!-- ENGINEERING HINT 3: ground-rail "trident" inside bottom node -->
        <g stroke-opacity="0.85" stroke-width="1.6">
          <line x1="80" y1="104" x2="80" y2="112"/>
          <line x1="70" y1="112" x2="90" y2="112"/>
          <line x1="74" y1="116" x2="86" y2="116" stroke-opacity="0.7"/>
          <line x1="77" y1="120" x2="83" y2="120" stroke-opacity="0.5"/>
        </g>

        <!-- connecting edges + arrowheads -->
        <line x1="62" y1="48" x2="98" y2="48" stroke-opacity="0.7"/>
        <line x1="40" y1="62" x2="74" y2="98" stroke-opacity="0.7"/>
        <line x1="120" y1="62" x2="86" y2="98" stroke-opacity="0.7"/>
        <path d="M 98 48 L 92 44 L 92 52 Z" class="accent-fill" stroke="none"/>
        <path d="M 74 98 L 70 92 L 78 94 Z" class="accent-fill" stroke="none"/>
        <path d="M 86 98 L 90 92 L 82 94 Z" class="accent-fill" stroke="none"/>
      </g>
    </g>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
    <text x="320" y="170" font-size="72" font-weight="800"
          fill="#F8FAFC" letter-spacing="-3">drawio-engineering-mcp</text>

    <g id="version-pill" transform="translate(320, 188)">
      <rect x="0" y="0" width="58" height="30" rx="15"
            fill="#0F172A" class="accent-stroke" stroke-width="1.5"/>
      <text x="29" y="20" font-size="14" font-weight="700"
            class="accent-fill" text-anchor="middle">v1.0.0</text>
    </g>

    <text x="386" y="208" font-size="22" font-weight="500" fill="#94A3B8">
      Engineering diagrams in draw.io · RF block diagrams · PCB stackups · EMC test setups
    </text>

    <g font-size="14" font-weight="600" fill="#64748B">
      <text x="320" y="240">rf · pcb · emc · 269 stencils · 10 tools · drawio · node.js</text>
    </g>

    <g transform="translate(320, 256)" font-size="13" font-weight="700">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="58" height="22" rx="11" fill="#1E293B"/>
        <text x="29" y="15" fill="#22D3EE" text-anchor="middle">Node.js</text>
      </g>
      <g transform="translate(68, 0)">
        <rect x="0" y="0" width="74" height="22" rx="11" fill="#1E293B"/>
        <text x="37" y="15" fill="#F59E0B" text-anchor="middle">draw.io</text>
      </g>
      <g transform="translate(152, 0)">
        <rect x="0" y="0" width="50" height="22" rx="11" fill="#1E293B"/>
        <text x="25" y="15" fill="#A78BFA" text-anchor="middle">MCP</text>
      </g>
      <g transform="translate(212, 0)">
        <rect x="0" y="0" width="78" height="22" rx="11" fill="#1E293B"/>
        <text x="39" y="15" fill="#34D399" text-anchor="middle">Apache-2.0</text>
      </g>
    </g>
  </g>
</svg>
